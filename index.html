<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#241811"><title>3D 頭骨拼圖</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='28'%3E◈%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
  <div id="viewport" aria-label="可旋轉的三維頭骨拼圖"></div>
  <header class="topbar"><a class="brand" href="./"><span>3D 頭骨拼圖</span></a><div class="status"><i></i><span id="status-text">準備工作台</span></div></header>
  <aside class="left-panel">
    <section class="progress-card"><div class="progress-label"><span>組裝進度</span><strong><b id="count">00</b><span> / 13</span></strong></div><div class="progress-track"><div id="progress"></div></div><div class="stats"><span id="mode-label">自由探索</span><span id="timer">00:00</span></div></section>
    <div class="state-legend" aria-label="骨骼顏色說明"><span><i class="unplaced"></i>未拼合</span><span><i class="selected"></i>選取中</span><span><i class="placed"></i>已拼合</span></div>
    <div class="list-title">骨骼索引</div><nav id="bone-list" aria-label="骨骼索引"></nav>
  </aside>
  <aside class="detail-card"><div class="eyebrow" id="detail-kicker">學習提示</div><h2 id="bone-name">每一塊，都有它的位置。</h2><p id="bone-description">點選左側骨骼，查看名稱與說明；開始拼圖後，將骨骼拖向中央的透明輪廓。</p><button id="hint" class="text-button" disabled>顯示這塊骨骼的位置 <span>↗</span></button></aside>
  <div class="view-tools" aria-label="視角與畫質"><button id="home" title="回到預設側前方視角" aria-label="回到預設側前方視角">⌂</button><button id="rotate" title="自動旋轉" aria-label="自動旋轉" aria-pressed="false">↻</button><button id="ghost" title="顯示目標輪廓" aria-label="顯示目標輪廓" aria-pressed="true">◉</button><select id="quality" aria-label="畫質"><option value="balanced">均衡畫質</option><option value="performance">流暢優先</option><option value="high">細緻畫質</option></select></div>
  <div class="bottom-bar"><button id="start" class="primary" disabled>準備模型中…</button><button id="reset" class="secondary" hidden>重新開始</button></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="loading" class="loading"><div class="loader-mark">◈</div><h2>正在準備你的解剖工作台</h2><p id="load-message">載入骨骼與互動資料…</p><div class="load-track"><div id="load-progress"></div></div><button id="retry" class="secondary" hidden>重新載入</button></div>
  <dialog id="complete"><div class="complete-icon">✓</div><h2>拼圖完成</h2><p>你已完成 13 塊頭骨的組裝。</p><strong id="final-time"></strong><div class="dialog-actions"><button id="inspect" class="secondary">欣賞完整頭骨</button><button id="again" class="primary">再挑戰一次</button></div></dialog>
  <script type="module" src="app.js"></script>
</body></html>
